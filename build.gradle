plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.openmouth.app'
    compileSdk 35

    defaultConfig {
        applicationId "kr.openmouth.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
}
